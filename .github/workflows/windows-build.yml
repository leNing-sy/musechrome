name: Windows Build

on:
  push:
    branches:
      - feature/edge-clean-profile
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: python -m pip install PyQt6 PyInstaller

      - name: Test configuration and browser arguments
        run: python tests/ci_runner.py test_store.py

      - name: Test mailbox parsing and service configuration
        run: python tests/ci_runner.py test_auto_login.py

      - name: Test settings and mailbox UI
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/ci_runner.py test_mail_assist_ui.py

      - name: Test Chrome and Edge feature parity
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/ci_runner.py test_browser_parity.py

      - name: Test retained features and removed entry points
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/ci_runner.py test_app_pruning.py

      - name: Check retired updater entry points
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/ci_runner.py test_update.py

      - name: Check Python syntax
        run: python -m py_compile musechrome/app.py musechrome/store.py musechrome/auto_login.py

      - name: Build executable
        run: pyinstaller --noconfirm MuseChrome.spec

      - name: Write executable checksum
        run: |
          $exeHash = (Get-FileHash -LiteralPath dist/MuseChrome.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath dist/SHA256SUMS.txt -Value "$exeHash  MuseChrome.exe" -Encoding utf8

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: MuseChrome-windows-${{ github.sha }}
          path: |
            dist/MuseChrome.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
