name: Windows Build

on:
  push:
    branches:
      - feature/edge-clean-profile
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: python -m pip install PyQt6 PyInstaller

      - name: Run tests
        run: |
          python tests/test_store.py
          python tests/test_auto_login.py
          python -m py_compile musechrome/app.py musechrome/store.py musechrome/auto_login.py

      - name: Build executable
        run: pyinstaller --noconfirm MuseChrome.spec

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: MuseChrome-windows-${{ github.sha }}
          path: dist/MuseChrome.exe
          if-no-files-found: error
          retention-days: 14
