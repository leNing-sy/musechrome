name: Windows Build

on:
  push:
    branches:
      - feature/edge-clean-profile
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: python -m pip install PyQt6 PyInstaller

      - name: Test configuration and browser arguments
        run: |
          python tests/test_store.py -v *> store-test.log
          $testExitCode = $LASTEXITCODE
          $testOutput = Get-Content -LiteralPath store-test.log -Raw
          Write-Output $testOutput
          if ($testExitCode -ne 0) {
            $details = $testOutput.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error file=tests/test_store.py,title=Store_test_failure::$details"
            exit $testExitCode
          }

      - name: Test mailbox parsing and service configuration
        run: python tests/test_auto_login.py

      - name: Test settings and mailbox UI
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/test_mail_assist_ui.py

      - name: Test retained features and removed entry points
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/test_app_pruning.py

      - name: Check Python syntax
        run: python -m py_compile musechrome/app.py musechrome/store.py musechrome/auto_login.py

      - name: Build executable
        run: pyinstaller --noconfirm MuseChrome.spec

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: MuseChrome-windows-${{ github.sha }}
          path: dist/MuseChrome.exe
          if-no-files-found: error
          retention-days: 14
